services:
  mongo:
    image: mongodb/mongodb-atlas-local
    container_name: finsight-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - finsight-network

  redis:
    image: redis:7
    container_name: finsight-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finsight-network

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  finsight-network:
    driver: bridge

